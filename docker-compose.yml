services:
  fjordparcel:
    build: .
    container_name: fjordparcel
    env_file:
      - .env
    ports:
      - "8096:8080"
    environment:
      FJORDPARCEL_UPDATER_URL: http://fjordparcel-updater:8090
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys;\\ntry:\\n r=urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3); sys.exit(0 if r.getcode()==200 else 1)\\nexcept Exception:\\n sys.exit(1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  fjordparcel-updater:
    build:
      context: .
      dockerfile: updater_service/Dockerfile
    container_name: fjordparcel-updater
    working_dir: /repo
    environment:
      APP_DIR: /repo
      SERVICE_NAME: fjordparcel
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-fjordparcel}
      COMPOSE_SERVICES: "fjordparcel"
      FJORDPARCEL_UPDATER_STATE_DIR: /state
      FJORDPARCEL_AUTO_UPDATE_CHECK: ${FJORDPARCEL_AUTO_UPDATE_CHECK:-1}
      FJORDPARCEL_AUTO_UPDATE_CHECK_INTERVAL_MINUTES: ${FJORDPARCEL_AUTO_UPDATE_CHECK_INTERVAL_MINUTES:-30}
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - .:/repo
      - ./data/updater:/state
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
